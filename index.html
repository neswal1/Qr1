<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Heart Gesture & Head Nod</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #video-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 160px; height: 120px; border-radius: 8px;
            overflow: hidden; border: 1px solid #f59cff;
            transform: scaleX(-1); opacity: 0.6;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Giao diện nút bấm khi gật đầu thành công */
        #portal-btn {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            padding: 20px 40px;
            background: rgba(245, 156, 255, 0.2);
            color: #f59cff;
            border: 2px solid #f59cff;
            border-radius: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            display: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(245, 156, 255, 0.4);
        }
        #portal-btn.show { display: block; transform: translate(-50%, -50%) scale(1); }
        #portal-btn:hover { background: #f59cff; color: #000; }

        .ui-overlay {
            position: absolute; top: 20px; left: 20px; color: #f59cff;
            pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <h2 style="margin:0; font-weight: 300;">HEART CORE</h2>
        <p id="hint" style="color: white; font-size: 0.8rem;">Phá trái tim & Gật đầu để mở Cổng</p>
    </div>

    <button id="portal-btn" onclick="goToNextStep()">MỞ CODE MỚI</button>

    <div id="video-container"><video id="webcam" autoplay playsinline></video></div>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, particles;
        let particleData = [];
        const PARTICLE_COUNT = 7000;
        
        let targetExp = 0, currentExp = 0;
        let lastNoseY = 0;
        let isNodding = false;

        // Khởi tạo Three.js
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 4.5;
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();
            const posArray = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const x = (Math.random() - 0.5) * 3, y = (Math.random() - 0.5) * 3, z = (Math.random() - 0.5) * 3;
                const f = Math.pow(x*x + 2.25*y*y + z*z - 1, 3) - x*x*Math.pow(z, 3) - 0.1125*y*y*Math.pow(z, 3);
                if (f < 0) {
                    particleData.push({hx: x, hy: z, hz: y, rx: (Math.random()-0.5)*15, ry: (Math.random()-0.5)*15, rz: (Math.random()-0.5)*15});
                }
            }
            geo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            particles = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xf59cff, size: 0.03, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
            scene.add(particles);
        }

        async function setupAI() {
            await loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js");
            await loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js");
            await loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js");

            const video = document.getElementById('webcam');
            const hands = new window.Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
            const faceMesh = new window.FaceMesh({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});

            hands.setOptions({ maxNumHands: 2, modelComplexity: 0 });
            faceMesh.setOptions({ refineLandmarks: true, minDetectionConfidence: 0.5 });

            hands.onResults(res => {
                if (res.multiHandLandmarks && res.multiHandLandmarks.length >= 2) {
                    const d = Math.hypot(res.multiHandLandmarks[0][0].x - res.multiHandLandmarks[1][0].x, res.multiHandLandmarks[0][0].y - res.multiHandLandmarks[1][0].y);
                    targetExp = THREE.MathUtils.clamp((d - 0.2) / 0.5, 0, 1);
                } else { targetExp = 0; }
            });

            faceMesh.onResults(res => {
                if (res.multiFaceLandmarks && res.multiFaceLandmarks[0]) {
                    const nose = res.multiFaceLandmarks[0][1]; // Điểm mũi
                    if (lastNoseY && nose.y - lastNoseY > 0.015) { // Phát hiện chuyển động đi xuống nhanh (gật)
                        isNodding = true;
                        setTimeout(() => isNodding = false, 500);
                    }
                    lastNoseY = nose.y;
                }
            });

            new window.Camera(video, { onFrame: async () => { 
                await hands.send({image: video}); 
                await faceMesh.send({image: video}); 
            }, width: 480, height: 360 }).start();
        }

        function animate() {
            requestAnimationFrame(animate);
            currentExp = THREE.MathUtils.lerp(currentExp, targetExp, 0.05);
            const pos = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleData.length; i++) {
                const d = particleData[i], i3 = i * 3;
                pos[i3] += (THREE.MathUtils.lerp(d.hx, d.rx, currentExp) - pos[i3]) * 0.1;
                pos[i3+1] += (THREE.MathUtils.lerp(d.hy, d.ry, currentExp) - pos[i3+1]) * 0.1;
                pos[i3+2] += (THREE.MathUtils.lerp(d.hz, d.rz, currentExp) - pos[i3+2]) * 0.1;
            }
            particles.geometry.attributes.position.needsUpdate = true;
            particles.rotation.y += 0.005;

            // KIỂM TRA ĐIỀU KIỆN: Trái tim bị phá (Exp > 0.8) VÀ có Gật đầu
            const btn = document.getElementById('portal-btn');
            if (currentExp > 0.8 && isNodding) {
                btn.classList.add('show');
            }

            renderer.render(scene, camera);
        }

        // Hàm chuyển code/web
        window.goToNextStep = function() {
            // Thay đổi link này thành link web bạn muốn
            window.location.href = "https://google.com"; 
            // Hoặc thực hiện hành động khác tại đây
        };

        function loadScript(url) { return new Promise(r => { const s = document.createElement('script'); s.src = url; s.onload = r; document.head.appendChild(s); }); }

        initThree();
        setupAI();
        animate();
    </script>
</body>
</html>
