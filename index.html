<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Particle System with Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #color-picker { position: absolute; top: 10px; right: 10px; z-index: 10; }
        #video { display: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils@0.1/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
</head>
<body>
    <input type="color" id="color-picker" value="#ffffff">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        // Three.js setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas') });
        renderer.setSize(window.innerWidth, window.innerHeight);
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // Particles
        const particleCount = 5000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const targetPositions = new Float32Array(particleCount * 3); // For interpolation
        const material = new THREE.PointsMaterial({ size: 0.05, color: 0xffffff });
        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // Initialize positions as a sphere (collapsed state)
        const radius = 5;
        for (let i = 0; i < particleCount; i++) {
            const theta = Math.acos(2 * Math.random() - 1);
            const phi = 2 * Math.PI * Math.random();
            positions[i * 3] = radius * Math.sin(theta) * Math.cos(phi);
            positions[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
            positions[i * 3 + 2] = radius * Math.cos(theta);
            targetPositions[i * 3] = positions[i * 3];
            targetPositions[i * 3 + 1] = positions[i * 3 + 1];
            targetPositions[i * 3 + 2] = positions[i * 3 + 2];
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        camera.position.z = 15;

        // Color picker
        const colorPicker = document.getElementById('color-picker');
        colorPicker.addEventListener('input', (e) => {
            material.color.set(e.target.value);
        });

        // MediaPipe Hands setup
        const videoElement = document.getElementById('video');
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
        });
        hands.setOptions({
            maxNumHands: 1, // Only one hand
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        let handOpenness = 0; // 0: closed, 1: open

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                // Detect hand openness: distance between thumb tip (4) and index finger tip (8)
                // Also check middle (12), ring (16), pinky (20) to wrist (0) for better detection
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const middleTip = landmarks[12];
                const ringTip = landmarks[16];
                const pinkyTip = landmarks[20];
                const wrist = landmarks[0];

                const distThumbIndex = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y, thumbTip.z - indexTip.z);
                const distIndexWrist = Math.hypot(indexTip.x - wrist.x, indexTip.y - wrist.y, indexTip.z - wrist.z);
                const distMiddleWrist = Math.hypot(middleTip.x - wrist.x, middleTip.y - wrist.y, middleTip.z - wrist.z);
                const distRingWrist = Math.hypot(ringTip.x - wrist.x, ringTip.y - wrist.y, ringTip.z - wrist.z);
                const distPinkyWrist = Math.hypot(pinkyTip.x - wrist.x, pinkyTip.y - wrist.y, pinkyTip.z - wrist.z);

                // Simple heuristic: if fingers are extended (dist to wrist > threshold) and thumb-index apart
                const fingerExtendedThreshold = 0.2; // Normalized distance
                const openCount = [distIndexWrist, distMiddleWrist, distRingWrist, distPinkyWrist].filter(d => d > fingerExtendedThreshold).length;
                const isOpen = openCount >= 3 && distThumbIndex > 0.05;

                handOpenness = isOpen ? 1 : 0; // Binary for simplicity, or lerp for smoothness

                // Update target positions based on openness
                const expandRadius = 20; // Expanded state radius
                for (let i = 0; i < particleCount; i++) {
                    const baseX = positions[i * 3] / radius * expandRadius * handOpenness;
                    const baseY = positions[i * 3 + 1] / radius * expandRadius * handOpenness;
                    const baseZ = positions[i * 3 + 2] / radius * expandRadius * handOpenness;
                    targetPositions[i * 3] = baseX + (1 - handOpenness) * positions[i * 3];
                    targetPositions[i * 3 + 1] = baseY + (1 - handOpenness) * positions[i * 3 + 1];
                    targetPositions[i * 3 + 2] = baseZ + (1 - handOpenness) * positions[i * 3 + 2];
                }
            } else {
                handOpenness = 0; // Default to closed if no hand detected
            }
        });

        // Camera setup
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        cameraUtils.start();

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Interpolate positions towards targets for smooth transition
            const positionsAttr = geometry.getAttribute('position');
            for (let i = 0; i < particleCount * 3; i++) {
                positionsAttr.array[i] += (targetPositions[i] - positionsAttr.array[i]) * 0.1; // Lerp factor
            }
            positionsAttr.needsUpdate = true;

            // Rotate the particle system slightly for visual interest
            particles.rotation.y += 0.001;

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
