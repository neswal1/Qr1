<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Smooth Heart - Fixed Style</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #video-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 160px; height: 120px; border-radius: 8px;
            overflow: hidden; border: 1px solid #f59cff;
            transform: scaleX(-1); opacity: 0.6;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .ui-overlay {
            position: absolute; top: 20px; left: 20px; color: #f59cff;
            pointer-events: none; text-shadow: 0 0 10px rgba(245, 156, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <h2 style="margin:0; font-weight: 300; letter-spacing: 4px;">SMOOTH HEART</h2>
        <p id="status" style="color: white; font-size: 0.7rem; opacity: 0.5;">Đang đợi camera...</p>
    </div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, particles;
        let particleData = [];
        const PARTICLE_COUNT = 7000;
        
        // Trạng thái điều khiển
        let targetExp = 0, currentExp = 0;
        let targetRotZ = 0, currentRotZ = 0;
        let targetRotY = 0, currentRotY = 0;

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 4.5;

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();
            const posArray = new Float32Array(PARTICLE_COUNT * 3);
            
            let count = 0;
            while (count < PARTICLE_COUNT) {
                const x = (Math.random() - 0.5) * 3;
                const y = (Math.random() - 0.5) * 3;
                const z = (Math.random() - 0.5) * 3;

                const x2 = x*x, y2 = y*y, z2 = z*z;
                // Phương trình: (x^2 + 9/4y^2 + z^2 - 1)^3 - x^2z^3 - 9/80y^2z^3 = 0
                const f = Math.pow(x2 + 2.25*y2 + z2 - 1, 3) - x2*Math.pow(z, 3) - 0.1125*y2*Math.pow(z, 3);

                if (f < 0) {
                    particleData.push({
                        hx: x, hy: z, hz: y,
                        rx: (Math.random() - 0.5) * 15,
                        ry: (Math.random() - 0.5) * 15,
                        rz: (Math.random() - 0.5) * 15
                    });
                    count++;
                }
            }

            geo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const mat = new THREE.PointsMaterial({
                color: 0xf59cff,
                size: 0.03,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                opacity: 0.8
            });

            particles = new THREE.Points(geo, mat);
            scene.add(particles);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        async function setupMediaPipe() {
            const videoElement = document.getElementById('webcam');
            
            // Load MediaPipe scripts
            await loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js");
            await loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js");

            const hands = new window.Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 0,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(results => {
                const status = document.getElementById('status');
                if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
                    status.innerText = "Đã kết nối 2 tay - Xoay để điều khiển";
                    const h1 = results.multiHandLandmarks[0][0];
                    const h2 = results.multiHandLandmarks[1][0];

                    // Khoảng cách (Co giãn)
                    const dist = Math.hypot(h1.x - h2.x, h1.y - h2.y);
                    targetExp = THREE.MathUtils.clamp((dist - 0.2) / 0.5, 0, 1);

                    // Góc (Xoay Z)
                    targetRotZ = Math.atan2(h2.y - h1.y, h2.x - h1.x);
                    
                    // Vị trí trung bình (Xoay Y nhẹ)
                    targetRotY = ((h1.x + h2.x) / 2 - 0.5) * 2;
                } else {
                    status.innerText = "Hãy giơ 2 bàn tay lên";
                    targetExp = 0;
                    targetRotY = 0;
                }
            });

            const cameraPipe = new window.Camera(videoElement, {
                onFrame: async () => { await hands.send({image: videoElement}); },
                width: 480, height: 360
            });
            cameraPipe.start();
        }

        function animate() {
            requestAnimationFrame(animate);

            // Nội suy mượt mà hơn (Lerp)
            currentExp = THREE.MathUtils.lerp(currentExp, targetExp, 0.05);
            currentRotZ = THREE.MathUtils.lerp(currentRotZ, targetRotZ, 0.07);
            currentRotY = THREE.MathUtils.lerp(currentRotY, targetRotY, 0.05);

            const positions = particles.geometry.attributes.position.array;
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const d = particleData[i];
                const i3 = i * 3;

                const tx = THREE.MathUtils.lerp(d.hx, d.rx, currentExp);
                const ty = THREE.MathUtils.lerp(d.hy, d.ry, currentExp);
                const tz = THREE.MathUtils.lerp(d.hz, d.rz, currentExp);

                // Di chuyển hạt mượt mà
                positions[i3] += (tx - positions[i3]) * 0.1;
                positions[i3+1] += (ty - positions[i3+1]) * 0.1;
                positions[i3+2] += (tz - positions[i3+2]) * 0.1;
            }

            particles.geometry.attributes.position.needsUpdate = true;
            
            // Áp dụng xoay
            particles.rotation.z = currentRotZ;
            particles.rotation.y = currentRotY + (Date.now() * 0.0005); // Tự quay nhẹ + xoay theo tay

            renderer.render(scene, camera);
        }

        function loadScript(url) {
            return new Promise(r => { const s = document.createElement('script'); s.src = url; s.onload = r; document.head.appendChild(s); });
        }

        initThree();
        setupMediaPipe();
        animate();
    </script>
</body>
</html>
