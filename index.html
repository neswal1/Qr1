<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Heart Gesture & Head Nod</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        
        /* Giao diện nhập mật khẩu */
        #password-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.8s ease;
        }
        #password-screen input {
            padding: 12px 20px; font-size: 1.2rem; border-radius: 30px;
            border: 1px solid #f59cff; background: rgba(245, 156, 255, 0.1);
            color: #f59cff; outline: none; text-align: center; width: 250px;
            box-shadow: 0 0 15px rgba(245, 156, 255, 0.2);
        }
        #password-screen p { color: #f59cff; letter-spacing: 2px; margin-bottom: 20px; font-size: 0.9rem; }

        #canvas-container { width: 100vw; height: 100vh; }
        #video-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 160px; height: 120px; border-radius: 8px;
            overflow: hidden; border: 1px solid #f59cff;
            transform: scaleX(-1); opacity: 0.6;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        #portal-btn {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            padding: 20px 40px; background: rgba(245, 156, 255, 0.2);
            color: #f59cff; border: 2px solid #f59cff; border-radius: 50px;
            font-size: 1.5rem; cursor: pointer; backdrop-filter: blur(10px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100; display: none; text-transform: uppercase;
            letter-spacing: 2px; box-shadow: 0 0 30px rgba(245, 156, 255, 0.4);
        }
        #portal-btn.show { display: block; transform: translate(-50%, -50%) scale(1); }
        .ui-overlay { position: absolute; top: 20px; left: 20px; color: #f59cff; pointer-events: none; z-index: 10; }
    </style>
</head>
<body>

    <div id="password-screen">
        <p>IDENTIFICATION REQUIRED</p>
        <input type="password" id="pw-input" placeholder="Nhập mật khẩu..." autofocus>
        <div id="error-msg" style="color: red; font-size: 0.8rem; margin-top: 10px; display: none;">Mật khẩu sai rồi!</div>
    </div>

    <div class="ui-overlay">
        <h2 style="margin:0; font-weight: 300;">HEART CORE</h2>
        <p id="hint" style="color: white; font-size: 0.8rem;">Phá trái tim & Gật đầu để mở Cổng</p>
    </div>

    <button id="portal-btn" onclick="goToNextStep()">MỞ CODE MỚI</button>

    <div id="video-container"><video id="webcam" autoplay playsinline></video></div>
    <div id="canvas-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js"></script>

    <script>
        // CẤU HÌNH MẬT KHẨU TẠI ĐÂY
        const SECRET_KEY = "123"; 

        const pwInput = document.getElementById('pw-input');
        const pwScreen = document.getElementById('password-screen');
        const errorMsg = document.getElementById('error-msg');

        pwInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (pwInput.value === SECRET_KEY) {
                    startExperience();
                } else {
                    errorMsg.style.display = 'block';
                    pwInput.value = '';
                }
            }
        });

        let scene, camera, renderer, particles;
        let particleData = [];
        const PARTICLE_COUNT = 7000;
        let targetExp = 0, currentExp = 0, lastNoseY = 0, isNodding = false;

        function startExperience() {
            pwScreen.style.opacity = '0';
            setTimeout(() => {
                pwScreen.style.display = 'none';
                initThree();
                setupAI();
                animate();
            }, 800);
        }

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 4.5;
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();
            const posArray = new Float32Array(PARTICLE_COUNT * 3);

            // Generate points inside the heart shape
            let actualCount = 0;
            while (actualCount < PARTICLE_COUNT) {
                const x = (Math.random() - 0.5) * 3;
                const y = (Math.random() - 0.5) * 3;
                const z = (Math.random() - 0.5) * 3;
                const f = Math.pow(x*x + 2.25*y*y + z*z - 1, 3) - x*x*Math.pow(z, 3) - 0.1125*y*y*Math.pow(z, 3);
                if (f <= 0) {  // Inside the heart
                    const i3 = actualCount * 3;
                    posArray[i3] = x;
                    posArray[i3 + 1] = z;  // Note: swapping y and z for orientation
                    posArray[i3 + 2] = y;
                    particleData.push({
                        hx: x,
                        hy: z,
                        hz: y,
                        rx: (Math.random() - 0.5) * 15,
                        ry: (Math.random() - 0.5) * 15,
                        rz: (Math.random() - 0.5) * 15
                    });
                    actualCount++;
                }
            }

            geo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            particles = new THREE.Points(geo, new THREE.PointsMaterial({
                color: 0xf59cff,
                size: 0.03,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            }));
            scene.add(particles);
        }

        let handLandmarker, faceLandmarker;
        const { FilesetResolver, HandLandmarker, FaceLandmarker } = window;

        async function setupAI() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm");

            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                numHands: 2,
                runningMode: "VIDEO"
            });

            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                outputFaceBlendshapes: false,
                outputFacialTransformationMatrixes: false,
                numFaces: 1
            });

            const video = document.getElementById('webcam');
            navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                video.srcObject = stream;
                video.play();
            });

            predictWebcam();
        }

        let lastVideoTime = -1;
        function predictWebcam() {
            if (handLandmarker && faceLandmarker && webcam.readyState === webcam.HAVE_ENOUGH_DATA) {
                const nowInMs = performance.now();
                if (webcam.currentTime !== lastVideoTime) {
                    lastVideoTime = webcam.currentTime;

                    // Detect hands
                    const handResults = handLandmarker.detectForVideo(webcam, nowInMs);
                    if (handResults.landmarks && handResults.landmarks.length >= 2) {
                        const wrist1 = handResults.landmarks[0][0];
                        const wrist2 = handResults.landmarks[1][0];
                        const d = Math.hypot(wrist1.x - wrist2.x, wrist1.y - wrist2.y, wrist1.z - wrist2.z);
                        targetExp = THREE.MathUtils.clamp((d - 0.2) / 0.5, 0, 1);
                    } else {
                        targetExp = 0;
                    }

                    // Detect face for nodding
                    const faceResults = faceLandmarker.detectForVideo(webcam, nowInMs);
                    if (faceResults.landmarks && faceResults.landmarks[0]) {
                        const nose = faceResults.landmarks[0][1];  // Nose tip landmark
                        if (lastNoseY && nose.y - lastNoseY > 0.015) {
                            isNodding = true;
                            setTimeout(() => isNodding = false, 500);
                        }
                        lastNoseY = nose.y;
                    }
                }
            }

            requestAnimationFrame(predictWebcam);
        }

        function animate() {
            requestAnimationFrame(animate);
            currentExp = THREE.MathUtils.lerp(currentExp, targetExp, 0.05);
            const pos = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleData.length; i++) {
                const d = particleData[i], i3 = i * 3;
                pos[i3] = THREE.MathUtils.lerp(d.hx, d.rx, currentExp);
                pos[i3 + 1] = THREE.MathUtils.lerp(d.hy, d.ry, currentExp);
                pos[i3 + 2] = THREE.MathUtils.lerp(d.hz, d.rz, currentExp);
            }
            particles.geometry.attributes.position.needsUpdate = true;
            particles.rotation.y += 0.005;

            const btn = document.getElementById('portal-btn');
            if (currentExp > 0.8 && isNodding) { btn.classList.add('show'); }
            renderer.render(scene, camera);
        }

        window.goToNextStep = function() { window.location.href = "https://google.com"; };

    </script>
</body>
</html>
