<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Heart - Fixed & Smooth</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fff0f5; font-family: 'Segoe UI', sans-serif; }
        #password-screen {
            position: fixed; inset: 0; background: #ffc0cb; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input { 
            padding: 12px 25px; border-radius: 25px; border: 2px solid #ff69b4;
            text-align: center; outline: none; font-size: 1.1rem; color: #ff1493;
        }
        #portal-btn {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%) scale(0);
            padding: 12px 30px; background: #ff69b4; color: white; border: none;
            border-radius: 25px; cursor: pointer; transition: 0.4s; z-index: 100;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4); font-weight: bold;
        }
        #portal-btn.show { transform: translateX(-50%) scale(1); }
        #webcam { display: none; } /* Ẩn camera theo ý bạn */
        .ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #ff69b4; pointer-events: none; }
    </style>
</head>
<body>

    <div id="password-screen">
        <p style="color: white; letter-spacing: 2px; margin-bottom: 15px;">MẬT MÃ TÌNH YÊU (123)</p>
        <input type="password" id="pw" placeholder="Nhập mật khẩu..." autofocus>
    </div>

    <div class="ui">
        <h2 style="margin:0; font-weight: 300;">BEATING HEART</h2>
        <p style="font-size: 0.8rem; opacity: 0.7;">Dùng 2 tay kéo dãn để phá vỡ</p>
    </div>

    <button id="portal-btn" onclick="location.href='https://google.com'">TIẾP TỤC →</button>
    <video id="webcam" autoplay playsinline></video>
    <div id="canvas-container"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const SECRET = "123";
        const COUNT = 12000; 
        let scene, camera, renderer, points, data = [];
        let tExp = 0, cExp = 0;

        document.getElementById('pw').addEventListener('input', (e) => {
            if (e.target.value === SECRET) {
                document.getElementById('password-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('password-screen').remove();
                    init();
                    setupAI();
                }, 600);
            }
        });

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 6;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(COUNT * 3);

            for (let i = 0; i < COUNT; i++) {
                // Tạo điểm dựa trên phương trình X^(2/3) + 0.9 sin(80x) sqrt(3-x^2)
                const x = (Math.random() - 0.5) * 3.46; // sqrt(3) * 2
                const heartY = Math.pow(Math.abs(x), 2/3) + 0.9 * Math.sin(80 * x) * Math.sqrt(3 - x * x);
                
                // Thêm một chút nhiễu quanh biên để trái tim có độ dày
                const off = (Math.random() - 0.5) * 0.2;
                const finalY = heartY + off;
                const finalZ = (Math.random() - 0.5) * 0.5;

                data.push({
                    hx: x, hy: finalY - 0.5, hz: finalZ,
                    rx: (Math.random()-0.5)*15, ry: (Math.random()-0.5)*15, rz: (Math.random()-0.5)*15
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            points = new THREE.Points(geo, new THREE.PointsMaterial({ 
                color: 0xff69b4, size: 0.025, transparent: true, opacity: 0.8 
            }));
            scene.add(points);
            loop();
        }

        async function setupAI() {
            await Promise.all([
                loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"),
                loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js")
            ]);

            const hands = new window.Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
            hands.setOptions({ maxNumHands: 2, modelComplexity: 0 });
            hands.onResults(res => {
                if (res.multiHandLandmarks?.length >= 2) {
                    const h1 = res.multiHandLandmarks[0][0], h2 = res.multiHandLandmarks[1][0];
                    tExp = THREE.MathUtils.clamp((Math.hypot(h1.x - h2.x, h1.y - h2.y) - 0.2) * 2, 0, 1);
                } else tExp = 0;
            });

            new window.Camera(document.getElementById('webcam'), {
                onFrame: async () => await hands.send({image: document.getElementById('webcam')}),
                width: 480, height: 360
            }).start();
        }

        function loop() {
            requestAnimationFrame(loop);
            cExp += (tExp - cExp) * 0.08; // Làm mượt chuyển động phá vỡ
            const p = points.geometry.attributes.position.array;
            for (let i = 0; i < COUNT; i++) {
                const d = data[i], i3 = i * 3;
                p[i3] += (THREE.MathUtils.lerp(d.hx, d.rx, cExp) - p[i3]) * 0.12;
                p[i3+1] += (THREE.MathUtils.lerp(d.hy, d.ry, cExp) - p[i3+1]) * 0.12;
                p[i3+2] += (THREE.MathUtils.lerp(d.hz, d.rz, cExp) - p[i3+2]) * 0.12;
            }
            points.geometry.attributes.position.needsUpdate = true;
            
            // Xoay nhẹ nhàng, giới hạn góc để không bị quay ra sau
            points.rotation.y = Math.sin(Date.now() * 0.001) * 0.3;

            const btn = document.getElementById('portal-btn');
            if (cExp > 0.8) btn.classList.add('show'); else btn.classList.remove('show');
            renderer.render(scene, camera);
        }

        function loadScript(url) { return new Promise(r => { const s = document.createElement('script'); s.src = url; s.onload = r; document.head.appendChild(s); }); }
    </script>
</body>
</html>
